name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes (Django + Selenium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Os testes usam SQLite e o comando popular_demo em modo desenvolvimento.
      ENVIRONMENT: development
      SECRET_KEY: chave-de-testes-do-ci
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Conferir versão do Chrome
        run: google-chrome --version

      - name: Verificações do Django
        run: python manage.py check

      - name: Rodar a suíte de testes
        run: python manage.py test --verbosity 2
